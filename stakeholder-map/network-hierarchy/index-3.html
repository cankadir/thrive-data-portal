<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Network Hierarchy</title>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>
		<style>
			:root {
				--bg: #ffffff;
				--text: #0f172a;
				--muted: #64748b;
				--stroke: #cbd5e1;
				--node: #3b6fb6;
				--nodeLight: #b7d2f3;
				--center: #111827;
				--danger: #dc2626;
			}

			html,
			body {
				height: 100%;
				margin: 0;
				font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
				color: var(--text);
				background: var(--bg);
			}

			#app {
				height: 100%;
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			#main-row {
				flex: 1;
				min-height: 0;
				height: 100%;
				width: 100%;
				display: grid;
				grid-template-columns: minmax(280px, 36vw) 1fr;
				align-items: stretch;
			}

			@media (max-width: 720px) {
				#main-row {
					grid-template-columns: 1fr;
					grid-template-rows: minmax(220px, 38vh) 1fr;
				}

				#map-aside {
					border-right: none;
					border-bottom: 1px solid #e5e7eb;
				}
			}

			#map-aside {
				border-right: 1px solid #e5e7eb;
				min-height: max(360px, 32vh);
				display: flex;
				flex-direction: column;
			}

			#map-aside .map-title {
				font-size: 11px;
				font-weight: 600;
				color: var(--muted);
				padding: 8px 10px;
				border-bottom: 1px solid #e5e7eb;
				flex-shrink: 0;
			}

			#map {
				flex: 1;
				min-height: 320px;
				min-height: max(320px, 28vh);
				background: #e2e8f0;
				position: relative;
				z-index: 0;
			}

			.leaflet-container {
				background: #cbd5e1;
				font-family: inherit;
			}

			#viz-column {
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			#county-org-panel {
				flex: 0 0 auto;
				max-height: min(220px, 32vh);
				overflow: auto;
				padding: 10px 12px;
				border-bottom: 1px solid #e5e7eb;
				font-size: 12px;
				background: #fafafa;
			}

			#county-org-panel h2 {
				margin: 0 0 8px;
				font-size: 13px;
				font-weight: 600;
			}

			#county-org-panel .hint {
				margin: 0;
				color: var(--muted);
			}

			#county-org-panel ul {
				margin: 0;
				padding-left: 18px;
			}

			#county-org-panel li {
				margin: 2px 0;
			}

			.map-legend {
				background: rgba(255, 255, 255, 0.92);
				padding: 8px 10px;
				border-radius: 6px;
				box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
				font-size: 11px;
				line-height: 1.35;
				color: var(--text);
			}

			.map-legend .bar {
				height: 10px;
				border-radius: 3px;
				margin: 4px 0 2px;
				background: linear-gradient(
					to right,
					#f7fbff,
					#6baed6,
					#08519c
				);
			}

			header {
				padding: 10px 12px;
				border-bottom: 1px solid #e5e7eb;
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				gap: 10px;
				flex-wrap: wrap;
			}

			header h1 {
				font-size: 14px;
				margin: 0;
				font-weight: 600;
			}

			header .meta {
				font-size: 12px;
				color: var(--muted);
			}

			#viz {
				position: relative;
				flex: 1;
				min-height: 320px;
				display: flex;
				flex-direction: column;
			}

			#graph-match-summary {
				flex: 0 0 auto;
				padding: 8px 10px;
				font-size: 12px;
				color: var(--text);
				background: #f8fafc;
				border-bottom: 1px solid #e5e7eb;
				line-height: 1.4;
			}

			#graph-match-summary:empty,
			#graph-match-summary[hidden] {
				display: none;
			}

			/* Scope to the D3 network only — global svg {} breaks Leaflet’s map SVG sizing/coords */
			#chart {
				width: 100%;
				flex: 1;
				min-height: 0;
				display: block;
			}

			/* Default stroke; levels below set hierarchy (thickest at center → thinnest at partners) */
			.link {
				stroke: rgba(15, 23, 42, 0.2);
				stroke-width: 1px;
			}

			/* Center (Thrive) ↔ project types */
			.link.level-1 {
				stroke: rgba(15, 23, 42, 0.34);
				stroke-width: 3.5px;
			}

			/* Project type ↔ initiatives */
			.link.level-2 {
				stroke: rgba(15, 23, 42, 0.24);
				stroke-width: 2.1px;
			}

			/* Initiative ↔ partner orgs — outermost, finest */
			.link.level-3 {
				stroke: rgba(15, 23, 42, 0.14);
				stroke-width: 0.95px;
			}

			/* Partner hover: emphasize connected links, dim the rest */
			.link.is-dim {
				stroke: rgba(15, 23, 42, 0.28);
				stroke-width: 1.35px;
				opacity: 0.35;
			}

			.link.is-highlight {
				stroke: rgba(15, 23, 42, 0.65);
				stroke-width: 2.75px;
				opacity: 1;
			}

			.node circle {
				stroke: #0f172a;
				stroke-opacity: 0.18;
			}

			.node text {
				font-size: 12px;
				fill: var(--text);
				pointer-events: none;
			}

			.node.center circle {
				fill: var(--center);
				stroke: rgba(255, 255, 255, 0.85);
				stroke-width: 1.5px;
			}

			.node.type circle {
				fill: var(--node);
			}

			.node.type text {
				font-weight: 700;
				font-size: 23px;
				fill: var(--node);
			}

			.node.initiative circle {
				fill: var(--nodeLight);
				stroke: var(--node);
				stroke-opacity: 0.35;
			}

			.node.initiative text {
				font-size: 11px;
				fill: var(--text);
			}

			#viz.county-filter-active .node.initiative text {
				font-size: 13px;
				font-weight: 500;
			}

			.node.partner circle {
				fill: var(--center);
				stroke: var(--center);
				stroke-opacity: 0.2;
			}

			.node.partner text {
				font-size: 10px;
				fill: var(--muted);
			}

			.node.partner.is-hover circle {
				fill: var(--danger);
				stroke: var(--danger);
				stroke-opacity: 0.3;
			}

			.node.partner.is-dim circle {
				fill: #9ca3af;
				stroke: #9ca3af;
				stroke-opacity: 0.25;
			}

			.node.partner.is-dim {
				opacity: 0.25;
			}

			.node.partner.county-filter-match.is-dim {
				opacity: 1;
			}

			/* County map selection: hide partner nodes not in geojson org list (uppercase match) */
			.node.partner.county-filter-out circle {
				opacity: 0.1;
			}

			.node.partner.county-filter-out {
				pointer-events: none;
			}

			.link.county-filter-out {
				opacity: 0.05;
			}

			/* County selection: matched partners — muted red, modest emphasis */
			.node.partner.county-filter-match circle {
				fill: #e57373;
				stroke: #c62828;
				stroke-width: 1.25px;
				stroke-opacity: 0.35;
				r: 7.5px;
			}

			.node.partner.county-filter-match.is-hover circle {
				fill: #ef5350;
				stroke: #b71c1c;
			}

			.node.partner.county-filter-match.is-dim circle {
				fill: #e57373;
				stroke: #c62828;
				opacity: 0.5;
			}

			/* Initiative → partner — county match: slightly thicker than plain level-3, still lighter than inner hops */
			#chart .link.level-3.county-filter-match {
				stroke: rgba(198, 40, 40, 0.4);
				stroke-width: 1.35px;
				opacity: 0.9;
			}

			.county-panel-tools {
				margin-bottom: 8px;
			}

			.county-panel-tools button {
				font: inherit;
				font-size: 11px;
				padding: 4px 8px;
				border-radius: 6px;
				border: 1px solid var(--stroke);
				background: #fff;
				cursor: pointer;
				color: var(--text);
			}

			.county-panel-tools button:hover {
				background: #f1f5f9;
			}

			.tooltip {
				position: absolute;
				pointer-events: none;
				background: rgba(17, 24, 39, 0.92);
				color: #fff;
				padding: 8px 10px;
				border-radius: 6px;
				font-size: 12px;
				line-height: 1.25;
				transform: translate(10px, 10px);
				max-width: 340px;
				opacity: 0;
				transition: opacity 0.08s linear;
				white-space: normal;
			}

			.error {
				padding: 12px;
				color: #991b1b;
				background: #fef2f2;
				border: 1px solid #fee2e2;
				border-radius: 8px;
				margin: 12px;
				font-size: 13px;
			}
		</style>
	</head>
	<body>
		<div id="app">
			<header>
				<h1>Thrive Projects and Partners</h1>
			</header>
			<div id="main-row">
				<aside id="map-aside" aria-label="County map">
					<div class="map-title">Active organizations by county</div>
					<div id="map"></div>
				</aside>
				<div id="viz-column">
					<div id="county-org-panel" aria-live="polite">
						<p class="hint">Click a county on the map to list partner organizations located there.</p>
					</div>
					<div id="viz">
						<div id="graph-match-summary" aria-live="polite" hidden></div>
						<div id="tooltip" class="tooltip"></div>
						<svg id="chart" aria-label="Network graph"></svg>
					</div>
				</div>
			</div>
		</div>

		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
		<!-- D3 + Lodash -->
		<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/lodash@4/lodash.min.js"></script>

		<script>

			const INITIATIVES_URL = './initiative.json';
			const PARTNERS_URL = './partners.json';
			const ORG_REGIONS_URL = './org_regions.geojson';

			let graphModel = null;
			let partnersDataset = null;
			/** Uppercase org names from selected county geojson; null = show all partner nodes */
			let countyOrgUpperSet = null;
			const mapCountyApi = { resetSelection: () => {} };

			/** GeoJSON export may contain invalid JSON (NaN); normalize before parse. */
			function parseGeoJsonText(text) {
				return JSON.parse(String(text).replace(/\bNaN\b/g, 'null'));
			}

			function titleCaseCounty(name) {
				if (name == null || name === '') return '';
				const s = String(name).trim().toLowerCase().replace(/_/g, ' ');
				return s.replace(/\b\w/g, (c) => c.toUpperCase());
			}

			/** List org names from org_regions.geojson only (properties.Organization). */
			function renderCountyOrgPanel(feature) {
				const el = document.getElementById('county-org-panel');
				if (!feature) {
					el.innerHTML =
						'<p class="hint">Click a county on the map to list partner organizations located there.</p>';
					return;
				}
				const p = feature.properties || {};
				const county = titleCaseCounty(p.counties_split);
				const raw = Array.isArray(p.Organization) ? p.Organization : [];
				const uniq = _.uniq(raw.filter((o) => o != null && String(o).trim() !== ''));
				const sorted = _.orderBy(uniq, [(o) => String(o).toLowerCase()], ['asc']);
				const n = sorted.length;
				const count = p.count != null && Number.isFinite(Number(p.count)) ? Number(p.count) : n;

				const list = sorted.map((o) => `<li>${_.escape(String(o).trim())}</li>`).join('');
				el.innerHTML = `
					<div class="county-panel-tools">
						<button type="button" id="clear-county-filter-btn">Show all partners in graph</button>
					</div>
					<h2>${_.escape(county)}</h2>
					<div style="color:var(--muted);margin-bottom:0.5rem;">${count} organization${count === 1 ? '' : 's'} in this county</div>
					<ul>${list || '<li class="hint">No organizations listed.</li>'}</ul>
				`;
				const clearBtn = el.querySelector('#clear-county-filter-btn');
				if (clearBtn) clearBtn.addEventListener('click', () => clearCountySelection());
			}

			function renderMap(geojson) {
				const mapEl = document.getElementById('map');
				if (!geojson?.features?.length) return;

				const features = geojson.features;
				const counts = features
					.map((f) => f.properties?.count)
					.filter((c) => c != null && Number.isFinite(Number(c)));
				const max = Math.max(1, d3.max(counts) || 1);
				// Skip very light end of Blues so fills stay visible on the basemap
				const colorScale = d3
					.scaleSequential((t) => d3.interpolateBlues(0.15 + t * 0.85))
					.domain([0, max]);

				const map = L.map(mapEl, {
					scrollWheelZoom: true,
					// Avoid init with 0×0 when the flex layout has not measured yet
					trackResize: true,
				}).setView([35.15, -85.2], 8);

				L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
					attribution: '&copy; OpenStreetMap contributors',
					maxZoom: 19,
				}).addTo(map);

				let selectedLayer = null;

				function baseStyle(feature) {
					const c = feature.properties?.count;
					const v = c != null && Number.isFinite(Number(c)) ? Number(c) : 0;
					return {
						fillColor: colorScale(v),
						weight: 1.5,
						opacity: 1,
						color: '#1e3a8a',
						fillOpacity: 0.88,
					};
				}

				function highlightStyle(feature) {
					const s = baseStyle(feature);
					return { ...s, weight: 3, color: '#0f172a', fillOpacity: 0.95 };
				}

				const geoLayer = L.geoJSON(geojson, {
					style: baseStyle,
					onEachFeature(feature, layer) {
						layer.on({
							click() {
								if (selectedLayer) geoLayer.resetStyle(selectedLayer);
								selectedLayer = layer;
								layer.setStyle(highlightStyle(feature));
								layer.bringToFront?.();
								setCountySelection(feature);
							},
						});
					},
				}).addTo(map);

				mapCountyApi.resetSelection = function resetMapCountyPolygon() {
					if (selectedLayer) {
						geoLayer.resetStyle(selectedLayer);
						selectedLayer = null;
					}
				};

				function refitToData() {
					map.invalidateSize({ animate: false });
					const b = geoLayer.getBounds();
					if (b.isValid()) map.fitBounds(b.pad(0.1));
					else map.setView([35.15, -85.2], 9);
				}

				map.whenReady(() => {
					refitToData();
					requestAnimationFrame(refitToData);
					setTimeout(refitToData, 50);
					setTimeout(refitToData, 250);
				});

				if (typeof ResizeObserver !== 'undefined') {
					const ro = new ResizeObserver(() => map.invalidateSize({ animate: false }));
					ro.observe(mapEl);
				}

				const legend = L.control({ position: 'bottomright' });
				legend.onAdd = function () {
					const div = L.DomUtil.create('div', 'map-legend');
					div.innerHTML = `<div style="font-weight:600;margin-bottom:2px;">Organizations (count)</div>
						<div class="bar"></div>
						<div style="display:flex;justify-content:space-between;gap:8px;"><span>0</span><span>${max}</span></div>`;
					return div;
				};
				legend.addTo(map);

				window.addEventListener('resize', _.throttle(() => map.invalidateSize({ animate: false }), 160));
			}

			function normalizeString(value) {
				if (value === null || value === undefined) return null;
				const s = String(value).trim();
				return s.length ? s : null;
			}

			function orgNameUpper(value) {
				const n = normalizeString(value);
				return n ? n.toUpperCase() : null;
			}

			/**
			 * partners.json rows whose Organization matches county geojson list (both compared uppercase).
			 * Logs matched rows and geo names missing from partners file.
			 */
			function filterPartnersByGeoCounty(partners, geoFeature) {
				const raw = Array.isArray(geoFeature?.properties?.Organization)
					? geoFeature.properties.Organization
					: [];
				const geoUpperSet = new Set(raw.map((o) => String(o).trim().toUpperCase()).filter(Boolean));
				const matchedRows = partners.filter((row) => {
					const u = orgNameUpper(row.Organization);
					return u && geoUpperSet.has(u);
				});
				const partnerUppers = new Set(partners.map((row) => orgNameUpper(row.Organization)).filter(Boolean));
				const geoOrgsNotInPartnersFile = [...geoUpperSet].filter((g) => !partnerUppers.has(g));
				const payload = {
					county: geoFeature?.properties?.counties_split,
					comparison: 'UPPER(partners.Organization) vs UPPER(geojson Organization)',
					geoDistinctUpperCount: geoUpperSet.size,
					partnerRowsMatched: matchedRows.length,
					matchedPartnerRows: matchedRows,
					geoOrgsInCountyNotFoundInPartnersJson: geoOrgsNotInPartnersFile,
				};
				console.log('[county ↔ partners filter]', payload);
				return { geoUpperSet, matchedRows, payload };
			}

			/** How many county geojson org names (uppercase) exist as partner nodes in the graph. */
			function countGeoOrgsInNetworkGraph(model, geoFeature) {
				const raw = Array.isArray(geoFeature?.properties?.Organization)
					? geoFeature.properties.Organization
					: [];
				const geoUpperSet = new Set(raw.map((o) => String(o).trim().toUpperCase()).filter(Boolean));
				const partnerUpper = new Set(
					model.nodes.filter((n) => n.kind === 'partner').map((n) => String(n.label).toUpperCase())
				);
				let found = 0;
				for (const g of geoUpperSet) {
					if (partnerUpper.has(g)) found++;
				}
				return { found, total: geoUpperSet.size };
			}

			function updateGraphMatchSummary(feature) {
				const el = document.getElementById('graph-match-summary');
				if (!el) return;
				if (!feature || !graphModel) {
					el.textContent = '';
					el.hidden = true;
					return;
				}
				const { found, total } = countGeoOrgsInNetworkGraph(graphModel, feature);
				el.hidden = false;
				el.textContent = `${found} of ${total} organizations from this county’s geojson list appear as partner nodes in the network graph (matched by name, case-insensitive).`;
			}

			function setCountySelection(feature) {
				if (!graphModel || !partnersDataset) return;
				if (!feature) {
					clearCountySelection();
					return;
				}
				const { geoUpperSet } = filterPartnersByGeoCounty(partnersDataset, feature);
				countyOrgUpperSet = geoUpperSet.size > 0 ? geoUpperSet : null;
				document.getElementById('viz')?.classList.toggle('county-filter-active', !!countyOrgUpperSet);
				renderCountyOrgPanel(feature);
				renderGraph(graphModel);
				updateGraphMatchSummary(feature);
			}

			function clearCountySelection() {
				countyOrgUpperSet = null;
				document.getElementById('viz')?.classList.remove('county-filter-active');
				mapCountyApi.resetSelection?.();
				renderCountyOrgPanel(null);
				updateGraphMatchSummary(null);
				if (graphModel) renderGraph(graphModel);
			}

			function showError(message) {
				const viz = document.getElementById('viz');
				const div = document.createElement('div');
				div.className = 'error';
				div.textContent = message;
				viz.prepend(div);
			}

			async function loadData() {
				const [initiatives, partners] = await Promise.all([
					d3.json(INITIATIVES_URL),
					d3.json(PARTNERS_URL),
				]);

				if (!Array.isArray(initiatives)) {
					throw new Error('initiative.json did not load as an array');
				}
				if (!Array.isArray(partners)) {
					throw new Error('partners.json did not load as an array');
				}

				return { initiatives, partners };
			}

			function buildModel({ initiatives, partners }) {
				// Map Tag -> Set(Organization) for partner counts
				const orgsByTag = _.chain(partners)
					.groupBy((row) => normalizeString(row.Tag) || '__missing__')
					.mapValues((rows) =>
						new Set(
							rows
								.map((r) => normalizeString(r.Organization))
								.filter(Boolean)
						)
					)
					.value();

				// Count initiatives per Project Type (primary hierarchy requirement)
				const initiativesWithType = initiatives
					.map((row) => {
						const projectName = normalizeString(row['Project Name']);
						// Use the corrected column (Project Type.1). Fallback to Project Type.
						const projectType =
							normalizeString(row['Project Type.1']) ||
							normalizeString(row['Project Type']);
						const tag = normalizeString(row.Tag);
						const explanation = normalizeString(row['Project Explanation']);
						return { projectName, projectType, tag, explanation, raw: row };
					})
					.filter((x) => x.projectType);

				const initiativesByType = _.groupBy(initiativesWithType, (x) => x.projectType);

				// Also incorporate partners.json by computing unique orgs reachable via initiative tags per type
				const typeStats = Object.entries(initiativesByType).map(([type, rows]) => {
					const orgSet = new Set();
					for (const r of rows) {
						const t = r.tag;
						if (!t) continue;
						const set = orgsByTag[t];
						if (!set) continue;
						for (const org of set) orgSet.add(org);
					}

					return {
						type,
						initiativeCount: rows.length,
						partnerOrgCount: orgSet.size,
					};
				});

				const sortedTypes = _.orderBy(typeStats, ['initiativeCount', 'partnerOrgCount', 'type'], ['desc', 'desc', 'asc']);

				const centerId = 'center';

				const typeNodes = sortedTypes.map((t) => ({
					id: `type:${t.type}`,
					kind: 'type',
					label: t.type,
					initiativeCount: t.initiativeCount,
					partnerOrgCount: t.partnerOrgCount,
				}));

				const typeIdByType = _.fromPairs(typeNodes.map((n) => [n.label, n.id]));

				// Initiatives are best keyed by Tag (partners join uses Tag)
				const initiativeNodes = _.chain(initiativesWithType)
					.filter((r) => r.projectName)
					.uniqBy((r) => r.tag || `${r.projectType}__${r.projectName}`)
					.map((r) => {
						const orgSet = r.tag ? orgsByTag[r.tag] : null;
						const id = r.tag ? `initiative:${r.tag}` : `initiative:${r.projectType}::${r.projectName}`;
						return {
							id,
							kind: 'initiative',
							label: r.projectName,
							projectType: r.projectType,
							tag: r.tag,
							explanation: r.explanation,
							initiativeCount: 1,
							partnerOrgCount: orgSet ? orgSet.size : 0,
						};
					})
					.value();

				// Partner org nodes (3rd layer) + usage counts
				const orgUsageCount = new Map();
				for (const n of initiativeNodes) {
					if (!n.tag) continue;
					const set = orgsByTag[n.tag];
					if (!set) continue;
					for (const org of set) {
						orgUsageCount.set(org, (orgUsageCount.get(org) || 0) + 1);
					}
				}

				const partnerNodes = Array.from(orgUsageCount.entries())
					.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
					.map(([org, count]) => ({
						id: `org:${org}`,
						kind: 'partner',
						label: org,
						initiativeCount: count,
						partnerOrgCount: 0,
					}));

				const nodes = [
					{
						id: centerId,
						kind: 'center',
						label: 'Thrive',
						initiativeCount: initiatives.length,
						partnerOrgCount: _.uniq(partners.map((p) => normalizeString(p.Organization)).filter(Boolean)).length,
					},
					...typeNodes,
					...initiativeNodes,
					...partnerNodes,
				];

				const links = [
					...sortedTypes.map((t) => ({
						source: centerId,
						target: `type:${t.type}`,
					})),
					...initiativeNodes.map((n) => ({
						source: typeIdByType[n.projectType] || `type:${n.projectType}`,
						target: n.id,
					})),
					..._.flatMap(initiativeNodes, (n) => {
						if (!n.tag) return [];
						const set = orgsByTag[n.tag];
						if (!set || set.size === 0) return [];
						return Array.from(set).map((org) => ({
							source: n.id,
							target: `org:${org}`,
						}));
					}),
				];

				return { nodes, links };
			}

			function renderGraph(model) {
				const svg = d3.select('#chart');
				svg.selectAll('*').remove();

				const tooltip = document.getElementById('tooltip');

				const width = svg.node().clientWidth;
				const height = svg.node().clientHeight;
				const cx = width / 2;
				const cy = height / 2;

				// Zoom/pan setup
				svg.attr('viewBox', `0 0 ${width} ${height}`);
				const zoomRect = svg
					.append('rect')
					.attr('width', width)
					.attr('height', height)
					.attr('fill', 'transparent')
					.style('pointer-events', 'all');

				const viewport = svg.append('g').attr('class', 'viewport');

				const zoom = d3
					.zoom()
					.scaleExtent([0.12, 8])
					.on('zoom', (event) => {
						viewport.attr('transform', event.transform);
					});

				svg.call(zoom);

				// Selection state for partner highlighting
				let selectedInitiativeId = null;
				let hoveredInitiativeId = null;
				let hoveredPartnerId = null;

				const typeNodes = model.nodes.filter((n) => n.kind === 'type');
				const initiativeNodes = model.nodes.filter((n) => n.kind === 'initiative');
				const partnerNodes = model.nodes.filter((n) => n.kind === 'partner');
				const maxCount = d3.max(typeNodes, (d) => d.initiativeCount) || 1;

				const radiusScale = d3
					.scaleSqrt()
					.domain([0, maxCount])
					.range([14, 44]);

				const centerRadius = 34;
				const initiativeRadius = 12;
				const partnerRadius = 6;

				function nodeRadius(d) {
					if (d.kind === 'center') return centerRadius;
					if (d.kind === 'type') return radiusScale(d.initiativeCount);
					if (d.kind === 'initiative') return initiativeRadius;
					return partnerRadius;
				}

				const ringR = Math.max(140, Math.min(width, height) * 0.32);
				const angleStep = (Math.PI * 2) / Math.max(1, typeNodes.length);

				// Seed Project Type nodes on a ring; no fx/fy so the simulation can move them freely
				for (let i = 0; i < typeNodes.length; i++) {
					const a = i * angleStep - Math.PI / 2;
					const tx = cx + Math.cos(a) * ringR;
					const ty = cy + Math.sin(a) * ringR;
					typeNodes[i].x = tx;
					typeNodes[i].y = ty;
					delete typeNodes[i].fx;
					delete typeNodes[i].fy;
				}

				// Seed initiatives around their type node
				const initiativesByTypeId = _.groupBy(initiativeNodes, (n) => `type:${n.projectType}`);
				for (const t of typeNodes) {
					const kids = initiativesByTypeId[t.id] || [];
					for (let i = 0; i < kids.length; i++) {
						const a = (i / Math.max(1, kids.length)) * Math.PI * 2;
						const localR = Math.max(70, nodeRadius(t) + 55);
						kids[i].x = (t.x ?? cx) + Math.cos(a) * localR;
						kids[i].y = (t.y ?? cy) + Math.sin(a) * localR;
					}
				}

				// Seed partner orgs around their initiative
				const initiativesById = _.keyBy(initiativeNodes, (n) => n.id);
				const partnerById = _.keyBy(partnerNodes, (n) => n.id);
				const partnerLinks = model.links.filter((l) => String(l.source).startsWith('initiative:') && String(l.target).startsWith('org:'));
				const partnersByInitiative = _.groupBy(partnerLinks, (l) => l.source);

				for (const [initiativeId, links] of Object.entries(partnersByInitiative)) {
					const parent = initiativesById[initiativeId];
					if (!parent) continue;
					for (let i = 0; i < links.length; i++) {
						const child = partnerById[links[i].target];
						if (!child) continue;
						if (child.x != null && child.y != null) continue;
						const a = (i / Math.max(1, links.length)) * Math.PI * 2;
						const localR = Math.max(45, nodeRadius(parent) + 35);
						child.x = (parent.x ?? cx) + Math.cos(a) * localR;
						child.y = (parent.y ?? cy) + Math.sin(a) * localR;
					}
				}

				const centerNode = model.nodes.find((n) => n.kind === 'center');
				centerNode.x = cx;
				centerNode.y = cy;
				centerNode.fx = cx;
				centerNode.fy = cy;

				function linkLevel(l) {
					const s = typeof l.source === 'object' ? l.source.id : l.source;
					const t = typeof l.target === 'object' ? l.target.id : l.target;
					if (s === 'center' || t === 'center') return 1;
					if (String(s).startsWith('type:') || String(t).startsWith('type:')) return 2;
					return 3;
				}

				// Stable link ids for adjacency lookups
				model.links.forEach((l, i) => {
					l._id = i;
				});

				function partnerNodeCountyFilterOut(d) {
					if (!countyOrgUpperSet || d.kind !== 'partner') return false;
					return !countyOrgUpperSet.has(String(d.label).toUpperCase());
				}

				function linkPartnerCountyFilterOut(d) {
					if (!countyOrgUpperSet) return false;
					const t = typeof d.target === 'object' ? d.target.id : d.target;
					if (!String(t).startsWith('org:')) return false;
					const tgt =
						typeof d.target === 'object' ? d.target : model.nodes.find((n) => n.id === t);
					if (!tgt || tgt.kind !== 'partner') return false;
					return !countyOrgUpperSet.has(String(tgt.label).toUpperCase());
				}

				function partnerNodeCountyFilterMatch(d) {
					if (!countyOrgUpperSet || d.kind !== 'partner') return false;
					return countyOrgUpperSet.has(String(d.label).toUpperCase());
				}

				function linkPartnerCountyFilterMatch(d) {
					if (!countyOrgUpperSet) return false;
					const t = typeof d.target === 'object' ? d.target.id : d.target;
					if (!String(t).startsWith('org:')) return false;
					const tgt =
						typeof d.target === 'object' ? d.target : model.nodes.find((n) => n.id === t);
					if (!tgt || tgt.kind !== 'partner') return false;
					return countyOrgUpperSet.has(String(tgt.label).toUpperCase());
				}

				const link = viewport
					.append('g')
					.attr('stroke-linecap', 'round')
					.selectAll('line')
					.data(model.links)
					.join('line')
					.attr('class', (d) => `link level-${linkLevel(d)}`)
					.classed('county-filter-out', linkPartnerCountyFilterOut)
					.classed('county-filter-match', linkPartnerCountyFilterMatch);

				const node = viewport
					.append('g')
					.selectAll('g')
					.data(model.nodes)
					.join('g')
					.attr('class', (d) => `node ${d.kind}`)
					.classed('county-filter-out', partnerNodeCountyFilterOut)
					.classed('county-filter-match', partnerNodeCountyFilterMatch)
					.call(
						d3
							.drag()
							.on('start', (event, d) => {
								if (d.kind === 'center') return;
								if (!event.active) simulation.alphaTarget(0.12).restart();
								d.fx = d.x;
								d.fy = d.y;
							})
							.on('drag', (event, d) => {
								if (d.kind === 'center') return;
								d.fx = event.x;
								d.fy = event.y;
							})
							.on('end', (event, d) => {
								if (d.kind === 'center') return;
								if (!event.active) simulation.alphaTarget(0);
								d.fx = null;
								d.fy = null;
							})
					);

				node
					.append('circle')
					.attr('r', (d) => nodeRadius(d));

				// Labels only for Project Types + Project Names (initiatives)
				node
					.filter((d) => d.kind === 'type' || d.kind === 'initiative')
					.append('text')
					.attr('text-anchor', 'middle')
					.attr('dy', (d) => -nodeRadius(d) - 10)
					.text((d) => d.label);

				// Build adjacency: initiative -> set(org)
				const partnersByInitiativeId = new Map();
				for (const l of model.links) {
					const s = typeof l.source === 'object' ? l.source.id : l.source;
					const t = typeof l.target === 'object' ? l.target.id : l.target;
					if (!String(s).startsWith('initiative:')) continue;
					if (!String(t).startsWith('org:')) continue;
					if (!partnersByInitiativeId.has(s)) partnersByInitiativeId.set(s, new Set());
					partnersByInitiativeId.get(s).add(t);
				}

				const partnerNode = node.filter((d) => d.kind === 'partner');
				function applyPartnerDimming() {
					const activeId = hoveredInitiativeId || selectedInitiativeId;
					if (!activeId) {
						partnerNode.classed('is-dim', false);
						return;
					}
					const keep = partnersByInitiativeId.get(activeId) || new Set();
					partnerNode.classed('is-dim', (d) => !keep.has(d.id));
				}

				// Build adjacency: partner -> link ids (initiative->partner links)
				const linkIdsByPartnerId = new Map();
				for (const l of model.links) {
					const s = typeof l.source === 'object' ? l.source.id : l.source;
					const t = typeof l.target === 'object' ? l.target.id : l.target;
					if (!String(s).startsWith('initiative:')) continue;
					if (!String(t).startsWith('org:')) continue;
					if (!linkIdsByPartnerId.has(t)) linkIdsByPartnerId.set(t, new Set());
					linkIdsByPartnerId.get(t).add(l._id);
				}

				function applyPartnerLinkHighlight() {
					if (!hoveredPartnerId) {
						link.classed('is-highlight', false).classed('is-dim', false);
						return;
					}
					const keep = linkIdsByPartnerId.get(hoveredPartnerId) || new Set();
					link
						.classed('is-highlight', (d) => keep.has(d._id))
						.classed('is-dim', (d) => !keep.has(d._id));
				}

				// Click on background clears selection
				zoomRect.on('click', () => {
					selectedInitiativeId = null;
					hoveredInitiativeId = null;
					applyPartnerDimming();
				});

				node
					.on('mouseenter', function (event, d) {
						if (d.kind === 'partner') {
							d3.select(this).classed('is-hover', true);
							hoveredPartnerId = d.id;
							applyPartnerLinkHighlight();
							return;
						}
						if (d.kind === 'initiative') {
							hoveredInitiativeId = d.id;
							applyPartnerDimming();
						}
					})
					.on('mousemove', (event, d) => {
						let body = '';
						if (d.kind === 'initiative') {
							body += `<div>Project Type: <b>${_.escape(d.projectType || '')}</b></div>`;
							if (d.tag) body += `<div>Tag: <b>${_.escape(d.tag)}</b></div>`;
							if (d.explanation) body += `<div style="margin-top:6px;opacity:0.95;">${_.escape(d.explanation)}</div>`;
							body += `<div style="margin-top:6px;">Partner orgs (unique): <b>${d.partnerOrgCount ?? 0}</b></div>`;
						} else if (d.kind === 'partner') {
							body += `<div>Initiatives linked: <b>${d.initiativeCount ?? 0}</b></div>`;
						} else {
							const initiativesLabel = d.kind === 'center' ? 'Initiatives (total)' : 'Initiatives';
							body += `<div>${initiativesLabel}: <b>${d.initiativeCount ?? 0}</b></div>`;
							body += `<div>Partner orgs (unique): <b>${d.partnerOrgCount ?? 0}</b></div>`;
						}

						tooltip.innerHTML = `${
							`<div style="font-weight:600;margin-bottom:4px;">${_.escape(d.label)}</div>` + body
						}`;
						tooltip.style.left = `${event.offsetX}px`;
						tooltip.style.top = `${event.offsetY}px`;
						tooltip.style.opacity = '1';
					})
					.on('mouseleave', function (event, d) {
						tooltip.style.opacity = '0';
						d3.select(this).classed('is-hover', false);
						if (d.kind === 'partner') {
							hoveredPartnerId = null;
							applyPartnerLinkHighlight();
						}
						if (d.kind === 'initiative') {
							hoveredInitiativeId = null;
							applyPartnerDimming();
						}
					})
					.on('click', function (event, d) {
						if (d.kind !== 'initiative') return;
						event.stopPropagation();
						selectedInitiativeId = selectedInitiativeId === d.id ? null : d.id;
						applyPartnerDimming();
					});

				const simulation = d3
					.forceSimulation(model.nodes)
					.force(
						'link',
						d3
							.forceLink(model.links)
							.id((d) => d.id)
							.distance((l) => {
								const source = typeof l.source === 'object' ? l.source : model.nodes.find((n) => n.id === l.source);
								const target = typeof l.target === 'object' ? l.target : model.nodes.find((n) => n.id === l.target);

								if (source?.kind === 'center' || target?.kind === 'center') {
									return ringR;
								}
								// Type -> initiative
								if (source?.kind === 'type' || target?.kind === 'type') {
									return 110 + nodeRadius(target);
								}
								// Initiative -> partner
								// Push partner orgs farther from initiatives so they don't overlap.
								return 85 + nodeRadius(target);
							})
							.strength((l) => {
								const source = typeof l.source === 'object' ? l.source : model.nodes.find((n) => n.id === l.source);
								const target = typeof l.target === 'object' ? l.target : model.nodes.find((n) => n.id === l.target);
								// County filter: only edges to in-county partners pull the layout; others weight 0
								if (countyOrgUpperSet && source?.kind === 'initiative' && target?.kind === 'partner') {
									const inCounty = countyOrgUpperSet.has(String(target.label).toUpperCase());
									return inCounty ? 0.32 : 0;
								}
								if (source?.kind === 'center' || target?.kind === 'center') return 0.05;
								if (source?.kind === 'type' || target?.kind === 'type') return 0.55;
								return 0.22;
							})
					)
					.force('charge', d3.forceManyBody().strength(-680))
					.force(
						'collide',
						d3.forceCollide().radius((d) => {
							// Keep a clear buffer around the center so dense partner clusters
							// don't visually crowd the origin.
							if (d.kind === 'center') return nodeRadius(d) + 140;
							if (d.kind === 'type') return nodeRadius(d) + 22;
							if (d.kind === 'partner') return nodeRadius(d) + 16;
							return nodeRadius(d) + 12;
						})
					)
					.force('x', d3.forceX(cx).strength(0.04))
					.force('y', d3.forceY(cy).strength(0.04))
					.alpha(1)
					.alphaDecay(0.08);

				simulation.on('tick', () => {
					link
						.attr('x1', (d) => d.source.x)
						.attr('y1', (d) => d.source.y)
						.attr('x2', (d) => d.target.x)
						.attr('y2', (d) => d.target.y);

					node.attr('transform', (d) => `translate(${d.x},${d.y})`);
				});

				let didInitialFit = false;

				/** When a county is active, frame only Thrive + types/initiatives tied to matched partners + those partners. */
				function nodesForFitToView() {
					if (!countyOrgUpperSet) return model.nodes;

					const matchedPartnerIds = new Set(
						model.nodes
							.filter(
								(n) =>
									n.kind === 'partner' &&
									countyOrgUpperSet.has(String(n.label).toUpperCase())
							)
							.map((n) => n.id)
					);

					const initiativeIds = new Set();
					for (const l of model.links) {
						const s = typeof l.source === 'object' ? l.source.id : l.source;
						const t = typeof l.target === 'object' ? l.target.id : l.target;
						if (
							String(s).startsWith('initiative:') &&
							String(t).startsWith('org:') &&
							matchedPartnerIds.has(t)
						) {
							initiativeIds.add(s);
						}
					}

					const typeIds = new Set();
					for (const id of initiativeIds) {
						const inode = model.nodes.find((n) => n.id === id);
						if (inode?.kind === 'initiative' && inode.projectType) {
							typeIds.add(`type:${inode.projectType}`);
						}
					}

					return model.nodes.filter((n) => {
						if (n.kind === 'center') return true;
						if (n.kind === 'type') return typeIds.has(n.id);
						if (n.kind === 'initiative') return initiativeIds.has(n.id);
						if (n.kind === 'partner') return matchedPartnerIds.has(n.id);
						return false;
					});
				}

				function fitToView({ animate } = { animate: false }) {
					const focusNodes = nodesForFitToView();
					const xs = focusNodes.map((n) => n.x).filter((v) => Number.isFinite(v));
					const ys = focusNodes.map((n) => n.y).filter((v) => Number.isFinite(v));
					if (xs.length === 0 || ys.length === 0) return;

					const minX = Math.min(...xs);
					const maxX = Math.max(...xs);
					const minY = Math.min(...ys);
					const maxY = Math.max(...ys);

					const pad = countyOrgUpperSet ? 64 : 80;
					let dx = Math.max(1, maxX - minX);
					let dy = Math.max(1, maxY - minY);
					// Avoid max zoom when the framed set is a single point or tiny (e.g. only Thrive)
					if (countyOrgUpperSet) {
						dx = Math.max(dx, 200);
						dy = Math.max(dy, 200);
					}

					const scale = Math.min(width / (dx + pad * 2), height / (dy + pad * 2));
					const cxData = minX + dx / 2;
					const cyData = minY + dy / 2;
					const tx = width / 2 - scale * cxData;
					const ty = height / 2 - scale * cyData;

					const t = d3.zoomIdentity.translate(tx, ty).scale(scale);
					const sel = animate ? svg.transition().duration(450) : svg;
					sel.call(zoom.transform, t);
				}

				simulation.on('end', () => {
					if (didInitialFit) return;
					didInitialFit = true;
					fitToView({ animate: true });
				});

				// Fallback: fit after a short settle period even if simulation doesn't reach 'end'
				setTimeout(() => {
					if (didInitialFit) return;
					didInitialFit = true;
					fitToView({ animate: true });
				}, 800);

				function resize() {
					const w = svg.node().clientWidth;
					const h = svg.node().clientHeight;
					const nx = w / 2;
					const ny = h / 2;
					svg.attr('viewBox', `0 0 ${w} ${h}`);
					zoomRect.attr('width', w).attr('height', h);
					centerNode.fx = nx;
					centerNode.fy = ny;

					simulation.force('x', d3.forceX(nx).strength(0.04));
					simulation.force('y', d3.forceY(ny).strength(0.04));
					simulation.alpha(0.6).restart();
				}

				window.addEventListener('resize', _.throttle(resize, 120));
			}

			(async function main() {
				try {
					const data = await loadData();
					const model = buildModel(data);

					if (!model.links.length) {
						showError('No Project Type values found in initiative.json.');
						return;
					}

					graphModel = model;
					partnersDataset = data.partners;

					try {
						const geoRes = await fetch(ORG_REGIONS_URL);
						if (!geoRes.ok) throw new Error(`HTTP ${geoRes.status}`);
						const geoText = await geoRes.text();
						const gj = parseGeoJsonText(geoText);
						// Defer until after layout so #map is not 0×0 when Leaflet measures
						requestAnimationFrame(() => requestAnimationFrame(() => renderMap(gj)));
					} catch (mapErr) {
						console.warn(mapErr);
						const aside = document.getElementById('map-aside');
						if (aside) {
							aside.innerHTML =
								'<div class="map-title">County map</div><div class="error" style="margin:10px;">Could not load org_regions.geojson. Serve this folder over HTTP (not file://) or check the file path.</div>';
						}
					}

					renderGraph(model);
				} catch (e) {
					// Common gotcha: opening as file:// blocks fetch.
					showError(`Failed to load data. Details: ${e.message}`);
					console.error(e);
				}
			})();
		</script>
	</body>
</html>
