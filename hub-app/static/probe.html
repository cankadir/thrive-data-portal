<!doctype html><html><body><pre id="out">running</pre>
<iframe id="f" src="/regional-activity" style="width:1600px;height:1400px;border:0"></iframe>
<script type="module">
const f=document.getElementById('f');
f.addEventListener('load',()=>setTimeout(()=>{
  const d=f.contentDocument;const out=[];
  for(const h of d.querySelectorAll('.group-header')){
    const t=h.querySelector('.group-title');const i=h.querySelector('img');
    const hr=h.getBoundingClientRect(),tr=t.getBoundingClientRect(),ir=i?.getBoundingClientRect()??null;
    const cs=getComputedStyle(h);
    out.push({title:t.textContent.trim(),headerH:+hr.height.toFixed(1),titleH:+tr.height.toFixed(1),titleTop:+(tr.top-hr.top).toFixed(1),titleBottom:+(hr.bottom-tr.bottom).toFixed(1),iconTop:ir?+(ir.top-hr.top).toFixed(1):null,align:cs.alignItems,justify:cs.justifyContent,textAlign:getComputedStyle(t).textAlign,titleW:+tr.width.toFixed(1),headerW:+hr.width.toFixed(1)});
  }
  document.getElementById('out').textContent=JSON.stringify(out);
},15000));
</script></body></html>
